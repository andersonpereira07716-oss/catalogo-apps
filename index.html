<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Silva Apps & Games</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: monospace; }
        body { background-color: #0b0f19; color: #fff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 16px; }
        .header { width: 100%; display: flex; justify-content: space-between; align-items: center; max-width: 480px; margin-bottom: 24px; }
        .logo-title { color: #38bdf8; font-weight: bold; font-size: 16px; }
        .badge-catalog { background: #1e1b4b; color: #a5b4fc; padding: 6px 12px; border-radius: 20px; font-size: 11px; border: 1px solid #4f46e5; }
        
        .card { background: #111827; border: 1px solid #06b6d4; border-radius: 16px; padding: 20px; width: 100%; max-width: 480px; display: flex; flex-direction: column; align-items: center; box-shadow: 0 0 20px rgba(6, 182, 212, 0.2); }
        .highlight-badge { background: linear-gradient(90deg, #083344, #164e63); color: #22d3ee; padding: 4px 12px; border-radius: 12px; font-size: 10px; font-weight: bold; margin-bottom: 16px; border: 1px solid #0891b2; }
        
        .app-icon { width: 96px; height: 96px; border-radius: 22px; background: #1f2937; border: 2px solid #06b6d4; display: flex; align-items: center; justify-content: center; margin-bottom: 16px; box-shadow: 0 0 12px rgba(6, 182, 212, 0.4); overflow: hidden; }
        .app-icon img { width: 100%; height: 100%; object-fit: cover; }
        
        h1 { font-size: 20px; color: #fff; margin-bottom: 8px; text-align: center; }
        p { font-size: 12px; color: #9ca3af; text-align: center; margin-bottom: 24px; line-height: 1.5; }
        
        .btn-primary { width: 100%; background: linear-gradient(135deg, #4f46e5, #3b82f6); color: white; border: none; border-radius: 10px; padding: 14px; font-size: 13px; font-weight: bold; cursor: pointer; text-decoration: none; text-align: center; margin-bottom: 10px; box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4); display: block; }
        .btn-primary:active { transform: scale(0.98); }
        
        .btn-vip { width: 100%; background: linear-gradient(135deg, #059669, #10b981); color: white; border: 1px solid #34d399; border-radius: 10px; padding: 14px; font-size: 13px; font-weight: bold; cursor: pointer; text-decoration: none; text-align: center; display: block; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3); }
        .btn-vip:active { transform: scale(0.98); }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo-title">Silva Apps & Games</div>
        <div class="badge-catalog">Catálogo Oficial</div>
    </div>

    <div class="card">
        <div class="highlight-badge">✨ Lançamento em Destaque</div>
        
        <div class="app-icon">
            <img src="https://chronos-protocol-guug.vercel.app/icon-512.png" alt="Chronos Protocol Icon">
        </div>

        <h1>Chronos Protocol</h1>
        <p>Mergulhe numa experiência imersiva de gameplay estratégica e manipulação temporal com 100 fases dinâmicas.</p>

        <!-- Botão Grátis com Anúncios -->
        <a href="https://chronos-protocol-guug.vercel.app" target="_blank" class="btn-primary">🎮 Jogar Versão Grátis</a>
        
        <!-- Botão Venda Direta no Mercado Pago (Pix/Cartão) -->
        <a href="https://mpago.la/2c5xaaB" target="_blank" class="btn-vip">💎 Comprar Versão VIP / Sem Anúncios</a>
    </div>

</body>
</html>
