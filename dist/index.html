<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Silva Apps & Games</title>
    <style>*{box-sizing:border-box;margin:0;padding:0;font-family:monospace}body{color:#fff;background-color:#0b0f19;flex-direction:column;align-items:center;min-height:100vh;padding:16px;display:flex}.header{justify-content:space-between;align-items:center;width:100%;max-width:480px;margin-bottom:24px;display:flex}.logo-title{color:#38bdf8;font-size:16px;font-weight:700}.badge-catalog{color:#a5b4fc;background:#1e1b4b;border:1px solid #4f46e5;border-radius:20px;padding:6px 12px;font-size:11px}.card{background:#111827;border:1px solid #06b6d4;border-radius:16px;flex-direction:column;align-items:center;width:100%;max-width:480px;padding:20px;display:flex;box-shadow:0 0 20px #06b6d433}.highlight-badge{color:#22d3ee;background:linear-gradient(90deg,#083344,#164e63);border:1px solid #0891b2;border-radius:12px;margin-bottom:16px;padding:4px 12px;font-size:10px;font-weight:700}.app-icon{background:#1f2937;border:2px solid #06b6d4;border-radius:22px;justify-content:center;align-items:center;width:96px;height:96px;margin-bottom:16px;display:flex;overflow:hidden;box-shadow:0 0 12px #06b6d466}.app-icon img{object-fit:cover;width:100%;height:100%}h1{color:#fff;text-align:center;margin-bottom:8px;font-size:20px}p{color:#9ca3af;text-align:center;margin-bottom:24px;font-size:12px;line-height:1.5}.btn-primary{color:#fff;cursor:pointer;text-align:center;background:linear-gradient(135deg,#4f46e5,#3b82f6);border:none;border-radius:10px;width:100%;margin-bottom:10px;padding:14px;font-size:13px;font-weight:700;text-decoration:none;display:block;box-shadow:0 4px 12px #3b82f666}.btn-primary:active{transform:scale(.98)}.btn-vip{color:#fff;cursor:pointer;text-align:center;background:linear-gradient(135deg,#059669,#10b981);border:1px solid #34d399;border-radius:10px;width:100%;padding:14px;font-size:13px;font-weight:700;text-decoration:none;display:block;box-shadow:0 4px 12px #10b9814d}.btn-vip:active{transform:scale(.98)}</style>
</head>
<body>

    <div class="header">
        <div class="logo-title">Silva Apps & Games</div>
        <div class="badge-catalog">Catálogo Oficial</div>
    </div>

    <div class="card">
        <div class="highlight-badge">✨ Lançamento em Destaque</div>
        
        <div class="app-icon">
            <img src="https://chronos-protocol-guug.vercel.app/icon-512.png" alt="Chronos Protocol Icon">
        </div>

        <h1>Chronos Protocol</h1>
        <p>Mergulhe numa experiência imersiva de gameplay estratégica e manipulação temporal com 100 fases dinâmicas.</p>

        <!-- Botão Grátis com Anúncios -->
        <a href="https://chronos-protocol-guug.vercel.app" target="_blank" class="btn-primary">🎮 Jogar Versão Grátis</a>
        
        <!-- Botão Venda Direta no Mercado Pago (Pix/Cartão) -->
        <a href="https://mpago.la/2c5xaaB" target="_blank" class="btn-vip">💎 Comprar Versão VIP / Sem Anúncios</a>
    </div>

</body>
</html>
